name: CI

on:
  push:
    branches: [develop]
  pull_request:
  merge_group:
  # allow manual action run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: m13tLabs/gh-actions-templates/.github/workflows/docker-ci.yml@main
    permissions:
      contents: read
      pull-requests: write
      checks: write
      packages: read
      attestations: write
    with:
      image_name: nextcloudcmd-cli
      dockerhub: true
      smoke_test: |
        out="$(docker run --rm "$IMAGE" --version)"
        echo "$out"
        echo "$out" | grep -qE 'Nextcloud version 3\.(1[6-9]|[2-9][0-9])' \
          || { echo "unexpected nextcloudcmd version" >&2; exit 1; }
    secrets: inherit
